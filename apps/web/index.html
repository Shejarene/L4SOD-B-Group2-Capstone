<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Acadex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var dark = localStorage.getItem('darkMode') === 'true';
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1816');
        }
        var link = document.createElement('link');
        link.id = 'prime-theme-link';
        link.rel = 'stylesheet';
        link.href = dark
          ? 'https://cdn.jsdelivr.net/npm/primevue@3.52.0/resources/themes/lara-dark-indigo/theme.css'
          : 'https://cdn.jsdelivr.net/npm/primevue@3.52.0/resources/themes/lara-light-indigo/theme.css';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
