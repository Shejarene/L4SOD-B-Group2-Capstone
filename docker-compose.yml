version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: school-db
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: school-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: school_management
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-to-a-secure-random-string
      JWT_REFRESH_SECRET: change-this-to-another-secure-random-string
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "npm run migrate && npm run seed && npm start"

  frontend:
    build: ./frontend
    container_name: school-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
